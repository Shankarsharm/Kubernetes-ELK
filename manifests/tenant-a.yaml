apiVersion: v1
kind: Namespace
metadata:
  name: tenant-a
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: tenant-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing
  template:
    metadata:
      labels:
        app: billing
    spec:
      containers:
      - name: billing
        image: alpine:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            while true; do
              echo "{\"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"service\": \"billing\", \"action\": \"generate_invoice\", \"tenant\": \"B\"}"
              sleep 3
            done
