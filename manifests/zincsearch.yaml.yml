apiVersion: v1
kind: Namespace
metadata:
  name: logging
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zincsearch
  namespace: logging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zincsearch
  template:
    metadata:
      labels:
        app: zincsearch
    spec:
      containers:
      - name: zincsearch
        image: public.ecr.aws/zinclabs/zincsearch:latest
        env:
        - name: ZINC_FIRST_ADMIN_USER
          value: "admin"
        - name: ZINC_FIRST_ADMIN_PASSWORD
          value: "VectorAdmin123!"
        ports:
        - containerPort: 4080
        resources:
          limits:
            memory: "100Mi" # Uses 10x less memory than OpenSearch
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: zincsearch
  namespace: logging
spec:
  type: NodePort
  selector:
    app: zincsearch
  ports:
    - port: 4080
      targetPort: 4080
      nodePort: 30080